name: brain-tests
on:
  push: { branches: [main], paths: ['brain/**', '.github/workflows/brain-tests.yml'] }
  pull_request: { paths: ['brain/**', '.github/workflows/brain-tests.yml'] }
  workflow_dispatch:
jobs:
  brain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with: { vcpkgGitCommitId: "809d4e072ea48e74bc0c5e6c1227a5cc636a63ad", vcpkgJsonGlob: "brain/vcpkg.json" }
      - name: Configure
        run: cmake -S brain -B build-brain -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
      - name: Build
        run: cmake --build build-brain -j
      - name: Test
        run: ctest --test-dir build-brain --output-on-failure
