# Pip demo wiring: Pico 2 W plus breakout modules on jumper wires.
# GPIO numbers come from firmware/pins.hpp; scripts/check_wiring.py fails the build if they drift.
# Render: wireviz hardware/pip-wiring.yml   (needs graphviz)

metadata:
  title: Pip body v0, breadboard wiring
  description: Pico 2 W, ILI9341 face, VEML7700 light, MAX98357A chirps, button, RGB LED
  notes: Pin numbers in square brackets are Pico physical pins; GPx is the GPIO the firmware uses.

templates:
  - &jumper
    gauge: 0.25 mm2
    length: 0.15 m
    category: bundle
    type: Dupont jumper, female-female

connectors:
  Pico:
    type: Raspberry Pi Pico 2 W
    subtype: 2 x 20 header, pins 1 to 40
    notes: USB to the Mac for power, flashing, and serial. 3V3(OUT) is pin 36, VSYS pin 39.
    pinlabels: [GP0, GP1, GND, GP2, GP3, GP4 I2C_SDA, GP5 I2C_SCL, GND, GP6, GP7,
                GP8, GP9, GND, GP10 LED_R, GP11 LED_G, GP12 LED_B, GP13, GND, GP14, GP15 BUTTON,
                GP16, GP17 LCD_CS, GND, GP18 SPI_SCK, GP19 SPI_MOSI, GP20 LCD_DC, GP21 LCD_RST, GND, GP22, RUN,
                GP26 I2S_BCLK, GP27 I2S_LRCLK, GND, GP28 I2S_DIN, ADC_VREF, 3V3(OUT), 3V3_EN, GND, VSYS, VBUS]
    hide_disconnected_pins: true
  ILI9341:
    type: ILI9341 240x320 SPI TFT breakout
    subtype: 9-pin header, common red board
    notes: Backlight LED pin straight to 3V3. SDO (MISO) stays unconnected. MADCTL 0x28 in firmware; try 0xE8 if mirrored.
    pinlabels: [VCC, GND, CS, RESET, DC, SDI (MOSI), SCK, LED, SDO (MISO)]
    hide_disconnected_pins: true
  VEML7700:
    type: VEML7700 ambient light breakout
    subtype: I2C address 0x10
    notes: Breakout has its own pull-ups. Firmware tolerates it absent (lux reads -1).
    pinlabels: [VIN, 3Vo, GND, SCL, SDA]
    hide_disconnected_pins: true
  MAX98357A:
    type: MAX98357A I2S 3 W class-D amp breakout
    subtype: chirps, next plan
    notes: VIN accepts 2.5 to 5.5 V; 3V3 is quiet and safe, VSYS (pin 39) is louder. GAIN and SD left open (9 dB, enabled).
    pinlabels: [LRC, BCLK, DIN, GAIN, SD, GND, VIN, SPK+, SPK-]
    hide_disconnected_pins: true
  Speaker:
    type: 4 ohm 3 W speaker
    pinlabels: [+, -]
  Button:
    type: Tactile push button
    notes: Firmware enables the internal pull-up; pressed reads low.
    pinlabels: [A, B]
  LED:
    type: RGB LED, 4-pin, common cathode
    subtype: longest leg is the common
    notes: PIP_RGB_COMMON_ANODE 1 in config.h if yours is common anode (then COM goes to 3V3).
    pinlabels: [R, G, B, COM]
  R1:
    type: Resistor 220 ohm
    pinlabels: ["1", "2"]
  R2:
    type: Resistor 220 ohm
    pinlabels: ["1", "2"]
  R3:
    type: Resistor 220 ohm
    pinlabels: ["1", "2"]

cables:
  W_LCD:
    <<: *jumper
    wirecount: 8
    colors: [RD, BK, YE, OG, GN, BU, VT, WH]
    wirelabels: [3V3, GND, CS, RST, DC, MOSI, SCK, BL]
  W_ALS:
    <<: *jumper
    wirecount: 4
    colors: [RD, BK, YE, GN]
    wirelabels: [3V3, GND, SCL, SDA]
  W_AMP:
    <<: *jumper
    wirecount: 5
    colors: [RD, BK, BU, VT, WH]
    wirelabels: [3V3, GND, BCLK, LRC, DIN]
  W_SPK:
    gauge: 0.5 mm2
    length: 0.2 m
    category: bundle
    wirecount: 2
    colors: [RD, BK]
  W_BTN:
    <<: *jumper
    wirecount: 2
    colors: [GY, BK]
    wirelabels: [GP15, GND]
  W_LED_GPIO:
    <<: *jumper
    wirecount: 4
    colors: [RD, GN, BU, BK]
    wirelabels: [GP10, GP11, GP12, GND]
  W_LED_R:
    <<: *jumper
    wirecount: 3
    colors: [RD, GN, BU]

connections:
  # Face: SPI0 plus CS/DC/RST, backlight on 3V3
  - - Pico: [36, 38, 22, 27, 26, 25, 24, 36]
    - W_LCD: [1-8]
    - ILI9341: [1, 2, 3, 4, 5, 6, 7, 8]
  # Light: I2C0
  - - Pico: [36, 3, 7, 6]
    - W_ALS: [1-4]
    - VEML7700: [1, 3, 4, 5]
  # Chirps: I2S
  - - Pico: [36, 33, 31, 32, 34]
    - W_AMP: [1-5]
    - MAX98357A: [7, 6, 2, 1, 3]
  - - MAX98357A: [8, 9]
    - W_SPK: [1-2]
    - Speaker: [1, 2]
  # Button: GP15 to GND
  - - Pico: [20, 18]
    - W_BTN: [1-2]
    - Button: [1, 2]
  # Mood LED: GPIO through 220 ohm to each colour, common to GND
  - - Pico: [14]
    - W_LED_GPIO: [1]
    - R1: [1]
  - - Pico: [15]
    - W_LED_GPIO: [2]
    - R2: [1]
  - - Pico: [16]
    - W_LED_GPIO: [3]
    - R3: [1]
  - - Pico: [13]
    - W_LED_GPIO: [4]
    - LED: [4]
  - - R1: [2]
    - W_LED_R: [1]
    - LED: [1]
  - - R2: [2]
    - W_LED_R: [2]
    - LED: [2]
  - - R3: [2]
    - W_LED_R: [3]
    - LED: [3]
